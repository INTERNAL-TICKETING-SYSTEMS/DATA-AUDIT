# ------------------------------------------------------------------------------
# Configurações do Servidor
# ------------------------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------------------------
# Conexão com o Banco de Dados (PostgreSQL)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:audit_db}
spring.datasource.username=${DB_USER:audit_admin}
spring.datasource.password=${DB_PASSWORD:audit_secret_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# Tuning de Resiliência e Performance do Pool HikariCP
# ------------------------------------------------------------------------------
spring.datasource.hikari.pool-name=AuditHikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------------------------------------
# Configurações do JPA / Hibernate
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=audit_schema

# ------------------------------------------------------------------------------
# Documentação Swagger / OpenAPI
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method