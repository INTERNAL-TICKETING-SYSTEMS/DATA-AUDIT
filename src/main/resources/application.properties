# ------------------------------------------------------------------------------
# Configurações do Servidor
# ------------------------------------------------------------------------------
server.port=${PORT:8080}

# ------------------------------------------------------------------------------
# Conexão com o Banco de Dados (PostgreSQL) - Usando a URL completa do Render
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# Tuning de Resiliência e Performance do Pool HikariCP
# ------------------------------------------------------------------------------
spring.datasource.hikari.pool-name=AuditHikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------------------------------------
# Configurações do JPA / Hibernate (Utilizando o schema dedicado)
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------------------------------------------
# Documentação Swagger / OpenAPI
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ------------------------------------------------------------------------------
# Configuração da API do Brevo (Envio de E-mail via HTTP / Porta 443)
# ------------------------------------------------------------------------------
brevo.api.key=${BREVO_API_KEY:xkeysib-ac76be0a78505773bf7b559870a6c9195db276d66cba9f78727b49c}

# Inicialização automática do esquema SQL no Render
spring.sql.init.mode=always
spring.sql.init.platform=postgres